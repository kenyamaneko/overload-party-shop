name: publish

# api-shop Go モジュールを手動でタグ付け・公開する。
# バージョンを上げるタイミングは人が判断して workflow_dispatch で実行する。
# タグの手動打ちは禁止 — このワークフローがモジュールタグの唯一の発行元。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-${{ github.ref }}
  # タグの採番が競合しないように、先行ジョブの完了を待つ
  cancel-in-progress: false

permissions:
  # タグを push するために write 権限が必要
  contents: write

jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet api-shop
        run: go vet ./...
        working-directory: packages/api-shop

      - name: Build api-shop
        run: go build ./...
        working-directory: packages/api-shop

      - name: Determine next tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
        run: .github/scripts/publish/next-tag.sh

      - name: Tag and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/publish/tag-and-push.sh

