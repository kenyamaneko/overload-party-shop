name: publish

# Tags and publishes the api-shop Go module on push to main. Manual
# dispatch supports minor/major bumps; default is patch. NEVER tag
# manually — this workflow is the single writer of module tags.

on:
  push:
    branches: [main]
    paths:
      - "packages/api-shop/**"
      - "data/models.yaml"
      - "scripts/generate_types.py"
      - ".github/workflows/publish.yaml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-api-shop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet api-shop
        run: go vet ./...
        working-directory: packages/api-shop

      - name: Build api-shop
        run: go build ./...
        working-directory: packages/api-shop

      - name: Determine next tag
        id: tag
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: .github/scripts/next-tag.sh

      - name: Tag and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/tag-and-push.sh

