name: CI

# PR の品質ゲート。ブランチ保護の required status check として使う。
on:
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

jobs:
  check-source-branch:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source branch
        run: .github/scripts/ci/check-source-branch.sh "${{ github.head_ref }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      # golangci-lint-action のビルド済みバイナリは Go 1.25 未対応のため
      # go install でソースからビルドして使う
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Run lint
        run: golangci-lint run --timeout 5m ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run unit tests
        run: go test -race -count=1 ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/overload-party-common

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up gcloud (Firestore emulator)
        uses: google-github-actions/setup-gcloud@v2
      - name: Install Firestore emulator component
        run: gcloud components install cloud-firestore-emulator beta --quiet
      - name: Start Firestore emulator
        run: .github/scripts/ci/start-firestore-emulator.sh
      # Testcontainers はテスト中に自動 pull するが、時間がかかりタイムアウトの原因になるため事前に取得する
      - name: Pre-pull postgres image (Testcontainers)
        run: docker pull postgres:16-alpine
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run integration tests
        run: go test -race -count=1 -tags=integration ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*
          FIRESTORE_EMULATOR_HOST: localhost:9041
          FIRESTORE_PROJECT_ID: overload-party-test

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Cross-Repo Deps App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
          owner: kenyamaneko
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
          GO_MODULES_TOKEN: ${{ steps.app-token.outputs.token }}
        run: docker build --secret id=GO_MODULES_TOKEN,env=GO_MODULES_TOKEN -t shop:ci-scan .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: shop:ci-scan
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  codegen-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Python dependencies (schema-doc only)
        run: |
          pip install \
            "overload-party-doc-tools @ git+https://github.com/kenyamaneko/overload-party-common.git@main#subdirectory=packages/doc-tools"
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Run OpenAPI codegen
        run: scripts/generate_types.sh
      - name: Run schema-doc codegen
        run: python3 scripts/generate_schema_doc.py
      - name: Check for drift
        run: .github/scripts/ci/check-codegen-drift.sh

  openapi-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest
      - name: Detect breaking changes in data/openapi.yaml
        run: |
          git fetch origin "${{ github.base_ref }}"
          # base にも openapi.yaml が無い場合 (初回 PR) はスキップ
          if git show "origin/${{ github.base_ref }}:data/openapi.yaml" >/tmp/base-openapi.yaml 2>/dev/null; then
            oasdiff breaking /tmp/base-openapi.yaml data/openapi.yaml --fail-on ERR
          else
            echo "::notice::base に data/openapi.yaml が存在しないため diff チェックをスキップ"
          fi

  asyncapi-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install AsyncAPI CLI
        run: npm install -g @asyncapi/cli@latest
      - name: Detect breaking changes in data/asyncapi.yaml
        run: |
          git fetch origin "${{ github.base_ref }}"
          if git show "origin/${{ github.base_ref }}:data/asyncapi.yaml" >/tmp/base-asyncapi.yaml 2>/dev/null; then
            asyncapi diff /tmp/base-asyncapi.yaml data/asyncapi.yaml --type breaking
          else
            echo "::notice::base に data/asyncapi.yaml が存在しないため diff チェックをスキップ"
          fi
