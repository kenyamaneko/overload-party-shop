name: CI

# PR の品質ゲート兼、push:main でのテスト観点カタログ (ADR-055) 再生成に使う。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-ci.yaml@main
    with:
      needs-firestore-emulator: true
      codegen-needs-node: true
    secrets: inherit
