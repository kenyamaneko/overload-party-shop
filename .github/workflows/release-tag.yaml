name: Release Tag

# release/* または hotfix/* が main にマージされたとき、
# サービスの SemVer git tag を自動で作成する。
#   release/vX.Y.Z → vX.Y.Z
#   hotfix/*        → 最新タグの patch bump
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "${HEAD_REF}" == release/v* ]]; then
            VERSION="${HEAD_REF#release/}"
          elif [[ "${HEAD_REF}" == hotfix/* ]]; then
            LATEST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            VERSION="v${MAJOR}.${MINOR}.$(( PATCH + 1 ))"
          else
            echo "::error::Unexpected branch: ${HEAD_REF}"
            exit 1
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi
          git tag "${TAG}"
          git push origin "${TAG}"
