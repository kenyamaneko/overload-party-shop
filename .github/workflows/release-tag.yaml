name: Release Tag

# release/* または hotfix/* が main にマージされたとき、
# サービスの SemVer git tag を自動で作成する。
#   release/vX.Y.Z → vX.Y.Z
#   hotfix/*        → 最新タグの patch bump
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: .github/scripts/release-tag/determine-version.sh

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: .github/scripts/release-tag/create-and-push-tag.sh
