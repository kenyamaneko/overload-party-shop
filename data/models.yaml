# Shop service model definitions (service-owned SSoT).
#
# scripts/generate_types.py reads this file and emits to multiple targets:
#   - target: domain  -> internal/domain/   (package domain, internal logic types)
#   - target: wire    -> packages/api-shop/ (package apishop, REST/Pub-Sub wire contract)
#
# 同じ JSON 形状を要求するイベント型のように両層に出力したい場合は targets:
# でリスト指定する。

files:
  # ─── Domain entities (internal logic types; no db tags) ───────────────
  - name: shop_entity
    target: domain
    types:
      - name: Product
        comment: "Product は shop カタログの購入可能商品の共通属性。type 固有属性は FactionSetProduct / CosmeticProduct / SubscriptionProduct 等の per-type 型が保持する。"
        fields:
          - {name: ProductID, type: string}
          - {name: Name, type: string}
          - {name: Type, type: string}
          - {name: Price, type: int64}
          - {name: Description, type: "*string"}
          - {name: ImageURL, type: "*string"}
          - {name: IsActive, type: bool}

      - name: FactionSetProduct
        comment: "FactionSetProduct は ProductTypeFactionSet の per-type ビュー。Product 共通属性 + faction 配布対象を保持する。"
        fields:
          - {name: Product, type: Product}
          - {name: Faction, type: string}

      - name: CosmeticProduct
        comment: "CosmeticProduct は ProductTypeCosmetic の per-type ビュー。Product 共通属性 + cosmetic_items への参照を保持する。"
        fields:
          - {name: Product, type: Product}
          - {name: ItemType, type: string}
          - {name: ItemNo, type: int64}

      - name: SubscriptionProduct
        comment: "SubscriptionProduct は ProductTypeSubscription の per-type ビュー。type 固有属性は持たないが ProductView の sum 型を埋めるため定義する。"
        fields:
          - {name: Product, type: Product}

      - name: OneTimePurchase
        comment: "OneTimePurchase は単発 (非サブスクリプション) の購入レコード。"
        fields:
          - {name: PurchaseID, type: int64}
          - {name: PlayerID, type: string}
          - {name: ProductID, type: string}
          - {name: PurchasedAt, type: time.Time}

      - name: Subscription
        comment: "Subscription は継続課金の権利レコード。"
        fields:
          - {name: SubscriptionID, type: int64}
          - {name: PlayerID, type: string}
          - {name: ProductID, type: string}
          - {name: Status, type: string}
          - {name: CurrentPeriodStart, type: time.Time}
          - {name: CurrentPeriodEnd, type: time.Time}
          - {name: CreatedAt, type: time.Time}
          - {name: UpdatedAt, type: time.Time}

      - name: PlayerItem
        comment: "PlayerItem はプレイヤーが所有する cosmetic アイテム。"
        fields:
          - {name: PlayerID, type: string}
          - {name: ItemType, type: string}
          - {name: ItemNo, type: int64}
          - {name: AcquiredAt, type: time.Time}

      - name: ProductWithOwnership
        comment: "ProductWithOwnership は per-type ProductView (FactionSetProduct / CosmeticProduct / SubscriptionProduct のいずれか) にリクエスト元プレイヤーの所有状態を付与した usecase 層のビュー。"
        fields:
          - {name: ProductView, type: ProductView}
          - {name: IsOwned, type: bool}

  # ─── Domain enums (status machine / type discriminators) ──────────────
  - name: shop_enum
    target: domain
    constants:
      - type: string
        values:
          - {name: ProductTypeFactionSet, value: "faction_set"}
          - {name: ProductTypeCosmetic, value: "cosmetic"}
          - {name: ProductTypeSubscription, value: "subscription"}
          - {name: PlatformIOS, value: "ios"}
          - {name: PlatformAndroid, value: "android"}
          - {name: ItemTypeStamp, value: "stamp"}
          - {name: ItemTypePlaymat, value: "playmat"}
          - {name: ItemTypeSleeve, value: "sleeve"}
          - {name: ItemTypeIcon, value: "icon"}
          - {name: SubscriptionStatusActive, value: "active"}
          - {name: SubscriptionStatusExpired, value: "expired"}
          - {name: SubscriptionStatusCancelled, value: "cancelled"}
          - {name: SubscriptionStatusGracePeriod, value: "grace_period"}
          - {name: SubscriptionStatusRevoked, value: "revoked"}

  # ─── Inter-service events (need both domain and wire copies) ──────────
  # Service が生成するときは domain 版を使う。gateway 等の外部 subscriber は
  # packages/api-shop の wire 版を import する。両者は同じ JSON 形状で生成。
  - name: shop_event_faction_purchased
    targets: [domain, wire]
    constants:
      - type: string
        values:
          - {name: TopicFactionPurchased, value: "faction-purchased"}
          - {name: EventTypeFactionPurchased, value: "faction_purchased"}
    types:
      - name: FactionPurchasedEvent
        comment: |
          FactionPurchasedEvent はプレイヤーが faction を購入した際に shop が発行するイベント。
          subscriber: account (player_factions に INSERT) / card (faction 固有カード付与) / gateway (WS 通知)。
          subscriber は EventID で冪等性を担保する (at-least-once)。
        fields:
          - {name: EventType, type: string, json: "event_type"}
          - {name: EventID, type: string, json: "event_id"}
          - {name: Timestamp, type: time.Time, json: "timestamp"}
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: Faction, type: string, json: "faction"}

  - name: shop_event_premium_updated
    targets: [domain, wire]
    constants:
      - type: string
        values:
          - {name: TopicPremiumUpdated, value: "premium-updated"}
          - {name: EventTypePremiumUpdated, value: "premium_updated"}
          - {name: PremiumUpdatedSourceShop, value: "shop"}
    types:
      - name: PremiumUpdatedEvent
        comment: |
          PremiumUpdatedEvent は subscription 状態遷移により is_premium が変化した際に shop が発行するイベント。
          subscriber: account (players.is_premium / premium_expires_at を更新) / gateway (WS 通知)。
          subscriber は EventID で冪等性を担保する (at-least-once)。
        fields:
          - {name: EventType, type: string, json: "event_type"}
          - {name: EventID, type: string, json: "event_id"}
          - {name: Timestamp, type: time.Time, json: "timestamp"}
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: IsPremium, type: bool, json: "is_premium"}
          - {name: PremiumExpiresAt, type: "*time.Time", json: "premium_expires_at,omitempty"}
          - {name: Source, type: string, json: "source"}

  # ─── Wire types (REST request/response, webhook bodies) ───────────────
  - name: shop_wire
    target: wire
    types:
      - name: ProductResponse
        comment: "ProductResponse は商品カタログ API のレスポンス要素。"
        fields:
          - {name: ProductID, type: string, json: "product_id"}
          - {name: Name, type: string, json: "name"}
          - {name: Type, type: string, json: "type"}
          - {name: Price, type: int64, json: "price"}
          - {name: Content, type: json.RawMessage, json: "content"}
          - {name: Description, type: "*string", json: "description,omitempty"}
          - {name: ImageURL, type: "*string", json: "image_url,omitempty"}
          - {name: IsActive, type: bool, json: "is_active"}
          - {name: IsOwned, type: bool, json: "is_owned"}

      - name: PurchaseRequest
        comment: "PurchaseRequest は POST /shop/purchase および /shop/subscribe のリクエストボディ。"
        fields:
          - {name: ProductID, type: string, json: "product_id"}
          - {name: Platform, type: string, json: "platform"}
          - {name: PurchaseToken, type: string, json: "purchase_token"}

      - name: PurchaseResponse
        fields:
          - {name: Message, type: string, json: "message"}
          - {name: ProductID, type: string, json: "product_id"}

      - name: SubscribeResponse
        fields:
          - {name: Message, type: string, json: "message"}
          - {name: ExpiresAt, type: time.Time, json: "expires_at"}

      - name: SelectFactionRequest
        fields:
          - {name: Faction, type: string, json: "faction"}

      - name: RegisterRequest
        fields:
          - {name: Username, type: string, json: "username"}

      # ─── Webhook request bodies (external, Apple/Google signed) ───
      - name: AppleNotificationPayload
        comment: "AppleNotificationPayload は Apple が /webhook/apple に送る最上位ボディ。"
        fields:
          - {name: SignedPayload, type: string, json: "signedPayload"}

      - name: GoogleRTDNMessage
        comment: "GoogleRTDNMessage は Google が /webhook/google に送る Pub/Sub push ラッパー。"
        fields:
          - {name: Message, type: "GoogleRTDNMessageBody", json: "message"}

      - name: GoogleRTDNMessageBody
        comment: "GoogleRTDNMessageBody は GoogleRTDNMessage の内側の message 封筒。"
        fields:
          - {name: Data, type: string, json: "data"}

  # ─── Card view (narrow projection from card service) ─────────────────
  - name: card_view
    target: wire
    types:
      - name: CardView
        comment: "CardView は card service の CardDefinition レスポンスを shop 側で必要な範囲に絞った projection。"
        fields:
          - {name: CardID, type: string, json: "card_id"}
          - {name: CardName, type: string, json: "card_name"}
          - {name: Faction, type: string, json: "faction"}
          - {name: CardType, type: string, json: "card_type"}
          - {name: Restriction, type: string, json: "restriction"}
          - {name: IsActive, type: bool, json: "is_active"}
