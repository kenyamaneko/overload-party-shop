asyncapi: 3.0.0
info:
  title: overload-party-shop events
  version: 0.1.0
  description: |
    Shop service が発行する Pub/Sub イベントの契約。
    本ファイルが SSoT。`packages/api-shop` の event 型と event_type 定数は asyncapi-codegen が本ファイルから生成する。
    Topic 名 (物理 channel) は overload-party-infra (Terraform) が SSoT であり、本仕様には書かない。
    アプリは ConfigMap 由来の env var (CARD_PACK_PURCHASED_TOPIC / FACTION_ACQUIRED_TOPIC / PREMIUM_UPDATED_TOPIC) で物理 topic を解決する。

channels:
  CardPackPurchased:
    address: card-pack-purchased
    description: |
      プレイヤーが card_pack を含む商品 (faction_set / card_pack 等) を購入した際に shop が発行する論理チャネル。
      物理 topic 名は env CARD_PACK_PURCHASED_TOPIC に置き換える運用。
    messages:
      CardPackPurchasedEvent:
        $ref: "#/components/messages/CardPackPurchasedEvent"

  FactionAcquired:
    address: faction-acquired
    description: |
      プレイヤーが faction を獲得した業務事実を表す shop 発行イベント (論理チャネル)。
      物理 topic 名は env FACTION_ACQUIRED_TOPIC に置き換える運用。
    messages:
      FactionAcquiredEvent:
        $ref: "#/components/messages/FactionAcquiredEvent"

  PremiumUpdated:
    address: premium-updated
    description: |
      subscription 状態遷移により is_premium が変化した際に shop が発行する論理チャネル。
      物理 topic 名は env PREMIUM_UPDATED_TOPIC に置き換える運用。
    messages:
      PremiumUpdatedEvent:
        $ref: "#/components/messages/PremiumUpdatedEvent"

operations:
  publishCardPackPurchased:
    action: send
    channel:
      $ref: "#/channels/CardPackPurchased"
    summary: card_pack を含む商品の購入完了を通知。subscriber は card。

  publishFactionAcquired:
    action: send
    channel:
      $ref: "#/channels/FactionAcquired"
    summary: ファクション獲得の業務事実を通知。subscriber は account。

  publishPremiumUpdated:
    action: send
    channel:
      $ref: "#/channels/PremiumUpdated"
    summary: subscription 状態遷移による is_premium 変化を通知。subscriber は account。

components:
  messages:
    CardPackPurchasedEvent:
      name: CardPackPurchasedEvent
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CardPackPurchasedEvent"

    FactionAcquiredEvent:
      name: FactionAcquiredEvent
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FactionAcquiredEvent"

    PremiumUpdatedEvent:
      name: PremiumUpdatedEvent
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PremiumUpdatedEvent"

  schemas:
    CardPackPurchasedEvent:
      type: object
      description: |
        プレイヤーが card_pack を含む商品 (faction_set / card_pack 等) を購入した際に shop が発行するイベント。
        subscriber: card (GrantPack(card_pack_id) でカード配布)。
        subscriber は EventID で冪等性を担保する (at-least-once)。
      required: [event_type, event_id, timestamp, player_id, card_pack_id]
      properties:
        event_type:
          type: string
          const: card_pack_purchased
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        player_id:
          type: string
        card_pack_id:
          type: string

    FactionAcquiredEvent:
      type: object
      description: |
        プレイヤーが faction を獲得した業務事実を表す shop 発行イベント。
        subscriber: account (player_factions に INSERT、authoritative 所有権)。
        subscriber は EventID で冪等性を担保する (at-least-once)。
      required: [event_type, event_id, timestamp, player_id, faction]
      properties:
        event_type:
          type: string
          const: faction_acquired
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        player_id:
          type: string
        faction:
          type: string

    PremiumUpdatedEvent:
      type: object
      description: |
        subscription 状態遷移により is_premium が変化した際に shop が発行するイベント。
        subscriber: account (players.is_premium / premium_expires_at を更新)。
        subscriber は EventID で冪等性を担保する (at-least-once)。
      required: [event_type, event_id, timestamp, player_id, is_premium, source]
      properties:
        event_type:
          type: string
          const: premium_updated
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        player_id:
          type: string
        is_premium:
          type: boolean
        premium_expires_at:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - shop
