# ─── Endpoint groups (drives docs/API_REFERENCE.md generation) ───
endpoint_groups:
  - name: ヘルスチェック
    endpoints:
      - method: GET
        path: /health
        summary: サービス死活監視
        auth: なし（ClusterIP 内部のみ）
        response_type: null
        response_example: '{"status": "ok"}'

  - name: ショップ (internal REST — gateway → shop)
    description: >
      gateway が ClusterIP 経由で呼び出す内部 API。
      認証は gateway 側 Firebase Auth → X-Player-Id ヘッダ。
    endpoints:
      - method: GET
        path: /internal/v1/players/:playerId/products
        summary: 購入可能な商品一覧を返す（所持情報付き）
        auth: ClusterIP（gateway 経由）
        response_type: ProductResponse
        response_wrapper: '{"products": [...]}'

      - method: POST
        path: /internal/v1/players/:playerId/purchase
        summary: 1 回限りの商品を購入（ファクションセット / コスメ）
        auth: ClusterIP（gateway 経由）
        request_type: PurchaseRequest
        response_type: PurchaseResponse
        response_example: '{"message": "purchase accepted", "product_id": "..."}'
        errors:
          - {status: 400, reason: "無効なファクション / 非アクティブ商品 / 非対応プラットフォーム"}
          - {status: 402, reason: "レシート検証失敗"}
          - {status: 404, reason: "商品が見つからない"}
          - {status: 409, reason: "同一商品を既に所有"}

      - method: POST
        path: /internal/v1/players/:playerId/subscribe
        summary: サブスクリプション商品を購入（プレミアムパス等）
        auth: ClusterIP（gateway 経由）
        request_type: PurchaseRequest
        response_type: SubscribeResponse
        response_example: '{"message": "subscription accepted", "expires_at": "2025-01-01T00:00:00Z"}'
        errors:
          - {status: 400, reason: "商品がサブスクリプションタイプでない / 非対応プラットフォーム"}
          - {status: 402, reason: "サブスクリプション検証失敗"}
          - {status: 404, reason: "商品が見つからない"}

  - name: Webhook (外部 — Apple / Google ストアからのコールバック)
    description: >
      Apple App Store / Google Play Store がサブスクリプション状態変更時に
      直接呼び出す。認証は各ストアの署名検証で行う（Firebase Auth 不要）。
      IAP_MODE=local 時はルーティング自体が登録されない。
    endpoints:
      - method: POST
        path: /webhook/apple
        summary: Apple App Store Server Notifications V2 を受信
        auth: Apple JWS 署名検証
        request_type: AppleNotificationPayload
        response_example: "(空 body, 200 OK)"
        errors:
          - {status: 400, reason: "JSON パースエラー"}
          - {status: 500, reason: "通知処理失敗"}

      - method: POST
        path: /webhook/google
        summary: Google Real-Time Developer Notifications を受信
        auth: Google Pub/Sub push 署名検証
        request_type: GoogleRTDNMessage
        response_example: "(空 body, 200 OK)"
        errors:
          - {status: 400, reason: "JSON パースエラー"}
          - {status: 500, reason: "通知処理失敗"}
