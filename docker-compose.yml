# ローカル動作確認用の PostgreSQL。
# テストでは Testcontainers が別途コンテナを起動するため、
# 本 compose はあくまで `make run` (cmd/server) のローカル動作確認用。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  shop_pgdata:
